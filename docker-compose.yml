# Airflow (LocalExecutor) + PostGIS + Caddy (HTTPS e página de relatório).
# Uso: cp .env.example .env  →  editar as senhas  →  docker compose up -d --build
x-airflow-common: &airflow-common
  build: .
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    # Modo econômico (computador com ~8 GB de RAM): menos processos paralelos
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: "False"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Belem
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Belem
    # Conexão com o banco de dados territoriais (usada pelo DAG como "postgis_territorial")
    AIRFLOW_CONN_POSTGIS_TERRITORIAL: postgresql://territorial:${POSTGIS_PASSWORD}@postgis:5432/territorial
    # Fonte do MapBiomas (veja docs/MAPBIOMAS_FONTE.md)
    AIRFLOW_VAR_MAPBIOMAS_URL: ${MAPBIOMAS_URL:-}
    AIRFLOW_VAR_MAPBIOMAS_ARQUIVO_LOCAL: ${MAPBIOMAS_ARQUIVO_LOCAL:-}
    MAPBIOMAS_ABA: ${MAPBIOMAS_ABA:-COVERAGE_10}
    # Alertas por e-mail (opcional)
    ALERT_EMAIL: ${ALERT_EMAIL:-}
    AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST:-}
    AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT:-587}
    AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER:-}
    AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_FROM:-airflow@localhost}
    AIRFLOW__SMTP__SMTP_STARTTLS: "True"
    AIRFLOW__SMTP__SMTP_SSL: "False"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - airflow-logs:/opt/airflow/logs
    - territorial-data:/opt/airflow/data
    - territorial-reports:/opt/airflow/reports
  depends_on:
    airflow-db: {condition: service_healthy}
    postgis: {condition: service_healthy}

services:
  airflow-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [airflow-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: territorial
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGRES_DB: territorial
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"   # só local: use túnel SSH para conectar QGIS/Power BI
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "territorial"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --role Admin --firstname Admin --lastname Dados \
          --email admin@example.com --password "${AIRFLOW_ADMIN_PASSWORD}" || true
        airflow users create --username visitante --role Viewer --firstname Visitante --lastname Leitura \
          --email visitante@example.com --password "${AIRFLOW_VIEWER_PASSWORD}" || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    expose: ["8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      airflow-db: {condition: service_healthy}
      postgis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      airflow-db: {condition: service_healthy}
      postgis: {condition: service_healthy}

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - territorial-reports:/srv/reports:ro
      - caddy-data:/data
    depends_on: [airflow-webserver]

volumes:
  airflow-db-data:
  postgis-data:
  airflow-logs:
  territorial-data:
  territorial-reports:
  caddy-data:
